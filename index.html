<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initializing Secure Connection...</title>
    <!-- Favicon -->
    <link rel="icon" href="logo.png" type="image/png">
    
    <!-- Fallback Redirect -->
    <meta http-equiv="refresh" content="4; url=https://tally.so/r/RGbkdj">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #7b2cbf;
            --dark: #050505;
            --glow: rgba(0, 255, 204, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            background-color: var(--dark);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Cybernetic Grid Background */
        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            width: 200%; height: 200%;
            background: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        /* Radial Vignette */
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 20%, var(--dark) 80%);
            z-index: 2;
        }

        .hud-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            width: 100%;
            max-width: 500px;
            padding: 3rem;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 204, 0.1);
            border-radius: 20px;
            box-shadow: 
                0 0 30px rgba(0, 255, 204, 0.05),
                inset 0 0 20px rgba(0, 255, 204, 0.05);
            animation: containerEnter 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: scale(0.9);
            opacity: 0;
        }

        @keyframes containerEnter {
            to { transform: scale(1); opacity: 1; }
        }

        /* HUD Scanner Ring */
        .scanner-ring {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scanner-ring::before, .scanner-ring::after {
            content: '';
            position: absolute;
            border-radius: 50%;
        }

        .scanner-ring::before {
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(0, 255, 204, 0.3);
            animation: spin 10s linear infinite;
        }

        .scanner-ring::after {
            width: 120%;
            height: 120%;
            border: 1px solid rgba(123, 44, 191, 0.3);
            border-top-color: var(--secondary);
            border-bottom-color: var(--primary);
            animation: spin 4s linear infinite reverse;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
            z-index: 2;
            filter: drop-shadow(0 0 15px var(--glow));
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(0,255,204,0.3)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(0,255,204,0.8)); }
        }

        .text-content {
            text-align: center;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--primary), #fff, var(--secondary));
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gradientText 3s linear infinite;
            margin-bottom: 0.5rem;
        }

        @keyframes gradientText {
            to { background-position: 200% center; }
        }

        .status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #8892b0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .blinking-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* High-Tech Progress Bar */
        .progress-wrapper {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 4px;
            height: 8px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            border-radius: 2px;
            position: relative;
            animation: fillProgress 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: translateX(-100%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .manual-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #64748b;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 2px;
        }

        .manual-link:hover {
            color: var(--primary);
            text-shadow: 0 0 8px var(--glow);
        }

        .manual-link::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: 0;
            left: 0;
            background: var(--primary);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .manual-link:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }
        
        .sys-logs {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: rgba(100, 116, 139, 0.5);
            width: 100%;
            text-align: left;
            margin-top: -10px;
            height: 40px;
            overflow: hidden;
        }
        
        .sys-logs p {
            margin: 2px 0;
            animation: slideUp 4s forwards;
            opacity: 0;
        }
        
        .sys-logs p:nth-child(1) { animation-delay: 0.5s; }
        .sys-logs p:nth-child(2) { animation-delay: 1.5s; }
        .sys-logs p:nth-child(3) { animation-delay: 2.5s; }
        
        @keyframes slideUp {
            0% { transform: translateY(10px); opacity: 0; }
            10% { transform: translateY(0); opacity: 1; }
            90% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-10px); opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="vignette"></div>
    
    <div class="hud-container">
        <div class="scanner-ring">
            <img src="logo.png" alt="AIML Club Logo" class="logo" onerror="this.src='https://via.placeholder.com/90/050505/00ffcc?text=AIML'">
        </div>
        
        <div class="text-content">
            <h1 class="title">Handshake Initiated</h1>
            <div class="status">
                <div class="blinking-dot"></div>
                <span id="status-text">Resolving target node...</span>
            </div>
        </div>
        
        <div class="sys-logs">
            <p>> Connecting to suggestion portal...</p>
            <p>> Verifying secure token exchange...</p>
            <p>> Rerouting traffic to destination [200 OK]</p>
        </div>

        <div class="progress-wrapper">
            <div class="progress-fill"></div>
        </div>

        <a href="https://tally.so/r/RGbkdj" class="manual-link">>> FORCE_OVERRIDE: BYPASS_WAIT_TIME</a>
    </div>

    <script>
        const statusTexts = [
            "Resolving target node...",
            "Establishing secure connection...",
            "Synchronizing data streams...",
            "Redirecting..."
        ];
        
        let i = 0;
        const textElement = document.getElementById('status-text');
        
        setInterval(() => {
            if (i < statusTexts.length - 1) {
                i++;
                textElement.innerText = statusTexts[i];
            }
        }, 1000);

        // Redirect after 4 seconds (aligns with animations)
        setTimeout(() => {
            window.location.replace("https://tally.so/r/RGbkdj");
        }, 4000);
    </script>
</body>
</html>
