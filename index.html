<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIML Voice | Portal</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --primary: #00f0ff;
            --primary-dim: rgba(0, 240, 255, 0.4);
            --accent: #0080ff;
            --purple: #8b5cf6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --card-bg: rgba(16, 18, 23, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Mouse Tracker Glow */
        #cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        /* Ambient Mesh Background */
        .ambient-mesh {
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 128, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            z-index: 1;
            animation: breathe 15s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(5deg); }
        }

        /* Scanning lines */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.15;
        }

        /* Main Glass Card */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                inset 0 -1px 20px rgba(0, 240, 255, 0.05);
            animation: cardEnter 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--primary);
            border-radius: 50%;
            filter: blur(25px);
            opacity: 0.4;
            animation: logoBreathe 3s ease-in-out infinite alternate;
        }

        @keyframes logoBreathe {
            0% { transform: scale(0.8); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0.5; }
        }

        .logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 50%;
            position: relative;
            z-index: 2;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, #fff 0%, #b0c4de 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        /* Refined Progress Bar */
        .progress-wrapper {
            width: 100%;
            margin-bottom: 2rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            border-radius: 4px;
            box-shadow: 0 0 10px var(--primary-dim);
            position: relative;
            transition: width 0.1s ease;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 20px;
            background: #fff;
            filter: blur(5px);
            opacity: 0.8;
            animation: streak 2s linear infinite;
        }

        @keyframes streak {
            0% { transform: translateX(-100px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(20px); opacity: 0; }
        }

        /* AI System Logs */
        .logs-container {
            width: 100%;
            height: 60px;
            position: relative;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        .log-line {
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .log-line.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .log-line.exit {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* Canvas */
        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* Expand Transition */
        .glass-card.expanded {
            max-width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
            background: var(--bg-dark);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            justify-content: center;
        }

        .glass-card.expanded .logo-container,
        .glass-card.expanded .title,
        .glass-card.expanded .subtitle,
        .glass-card.expanded .progress-wrapper,
        .glass-card.expanded .logs-container {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="ambient-mesh"></div>
    <div id="particles"></div>
    <div class="scanlines"></div>
    <div id="cursor-glow"></div>

    <div class="glass-card" id="main-card">
        <div class="logo-container">
            <div class="logo-glow"></div>
            <img src="logo.png" alt="AIML Club Logo" class="logo" onerror="this.src='https://via.placeholder.com/70/0a0a0c/00f0ff?text=AI'">
        </div>
        
        <h1 class="title">AIML Voice</h1>
        <div class="subtitle">Innovation Portal</div>

        <div class="progress-wrapper">
            <div class="progress-header">
                <span>SYSTEM_STATUS</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="p-bar"></div>
            </div>
        </div>

        <div class="logs-container" id="logs">
            <!-- Logs injected via JS -->
        </div>
    </div>

    <script>
        // --- 1. Mouse Reactive Glow ---
        const cursorGlow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        // --- 2. Subtle Neural Particles ---
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.getElementById('particles').appendChild(canvas);
        
        let width, height, particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2; // Slower, elegant movement
                this.vy = (Math.random() - 0.5) * 0.2;
                this.radius = Math.random() * 1;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if(this.x < 0 || this.x > width) this.vx = -this.vx;
                if(this.y < 0 || this.y > height) this.vy = -this.vy;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        for(let i=0; i<40; i++) particles.push(new Particle()); // Reduced count for minimal look

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            
            for(let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                for(let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if(dist < 120) { // Connect nodes
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.1 - dist/1200})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- 3. AI System Logs & Progress ---
        const messages = [
            "Initializing neural interface...",
            "Authenticating student node...",
            "Syncing innovation channels...",
            "Connecting to AIML Voice...",
            "Establishing secure collaboration layer...",
            "Voice gateway established."
        ];

        const logsContainer = document.getElementById('logs');
        const pBar = document.getElementById('p-bar');
        const percentText = document.getElementById('percent');
        const card = document.getElementById('main-card');
        
        let currentMsg = 0;
        let progress = 0;
        const totalDuration = 4500; // 4.5 seconds to load
        const startTime = Date.now();

        // Setup log elements
        const logElements = messages.map(msg => {
            const el = document.createElement('div');
            el.className = 'log-line';
            el.textContent = msg;
            logsContainer.appendChild(el);
            return el;
        });

        function updateLoader() {
            const elapsed = Date.now() - startTime;
            progress = Math.min(100, (elapsed / totalDuration) * 100);
            
            // Ease out cubic logic for smooth bar progress
            const easeProgress = 1 - Math.pow(1 - (progress/100), 3);
            const currentPercent = Math.round(easeProgress * 100);
            
            pBar.style.width = `${currentPercent}%`;
            percentText.textContent = `${currentPercent}%`;

            // Update Logs based on progress
            const msgIndex = Math.floor((progress / 100) * messages.length);
            if (msgIndex !== currentMsg && msgIndex < messages.length) {
                if(logElements[currentMsg]) logElements[currentMsg].className = 'log-line exit';
                currentMsg = msgIndex;
                if(logElements[currentMsg]) logElements[currentMsg].className = 'log-line active';
            } else if (currentMsg === 0 && logElements[0].className === 'log-line') {
                logElements[0].className = 'log-line active';
            }

            if (progress < 100) {
                requestAnimationFrame(updateLoader);
            } else {
                completeLoading();
            }
        }

        function completeLoading() {
            // Cinematic Transition Unlock
            if(logElements[currentMsg]) logElements[currentMsg].className = 'log-line exit';
            
            const unlockMsg = document.createElement('div');
            unlockMsg.className = 'log-line active';
            unlockMsg.style.color = 'var(--primary)';
            unlockMsg.textContent = "ACCESS GRANTED";
            logsContainer.appendChild(unlockMsg);

            setTimeout(() => {
                // Expand card to fade out
                card.classList.add('expanded');
                
                // Finally redirect to Tally form
                setTimeout(() => {
                    window.location.replace("https://tally.so/r/RGbkdj");
                }, 800);
            }, 600);
        }

        requestAnimationFrame(updateLoader);

    </script>
</body>
</html>
