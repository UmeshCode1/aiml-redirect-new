<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIML | Secure Portal</title>
    <link rel="icon" href="logo.png" type="image/png">
    <!-- Removed meta refresh to handle redirect precisely via JS -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #030712;
            --primary: #38bdf8;
            --accent: #818cf8;
            --danger: #fb7185;
            --glow: rgba(56, 189, 248, 0.5);
            --card-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Particle Background */
        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* Ambient Glows */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 60%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            z-index: 2;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.1; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.2; }
        }

        /* Main UI Container */
        .hud-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 550px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.5), rgba(129, 140, 248, 0.1), rgba(56, 189, 248, 0.5));
            border-radius: 16px;
            clip-path: polygon(0 20px, 20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            animation: bootUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(30px);
            opacity: 0;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);
        }

        @keyframes bootUp {
            100% { transform: translateY(0); opacity: 1; }
        }

        .hud-inner {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
            position: relative;
        }

        /* Decorative Corners */
        .corner {
            position: absolute;
            width: 15px; height: 15px;
            border: 2px solid var(--primary);
            opacity: 0.7;
        }
        .c-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .c-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .c-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .c-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Hexagon Logo Container */
        .hex-container {
            position: relative;
            width: 120px;
            height: 138.56px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hex-border {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: transparent;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 2px solid var(--primary);
            animation: rotateHex 10s linear infinite;
            box-sizing: border-box;
        }
        
        .hex-border::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: inherit;
            border: 2px solid var(--accent);
            transform: scale(1.1);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: rotateHex 15s linear infinite reverse;
        }

        @keyframes rotateHex {
            100% { transform: rotate(360deg); }
        }

        .logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: contain;
            z-index: 5;
            filter: drop-shadow(0 0 10px var(--primary));
            animation: heartbeat 2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 20px var(--primary)); }
        }

        /* Typography */
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 4px;
            margin-bottom: 0.2rem;
            text-shadow: 0 0 15px var(--glow);
            position: relative;
        }

        /* Glitch Effect on Title */
        .glitch {
            position: relative;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--danger);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 var(--primary);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 86px, 0); }
            10% { clip: rect(44px, 9999px, 50px, 0); }
            20% { clip: rect(78px, 9999px, 10px, 0); }
            30% { clip: rect(22px, 9999px, 49px, 0); }
            40% { clip: rect(96px, 9999px, 34px, 0); }
            50% { clip: rect(48px, 9999px, 2px, 0); }
            60% { clip: rect(62px, 9999px, 88px, 0); }
            70% { clip: rect(31px, 9999px, 15px, 0); }
            80% { clip: rect(9px, 9999px, 55px, 0); }
            90% { clip: rect(87px, 9999px, 20px, 0); }
            100% { clip: rect(53px, 9999px, 73px, 0); }
        }

        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            color: var(--primary);
            font-size: 1rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid transparent;
            border-top-color: var(--primary);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Terminal Window */
        .terminal {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: #94a3b8;
            height: 80px;
            text-align: left;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .terminal::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: var(--primary);
            opacity: 0.5;
            box-shadow: 0 0 10px var(--primary);
        }

        .terminal-lines {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .line {
            display: flex;
            gap: 8px;
            opacity: 0;
            transform: translateX(-10px);
            animation: typeLine 0.1s forwards;
        }

        .line .prefix { color: var(--primary); }
        .line .success { color: #34d399; }
        .line .warning { color: #fbbf24; }

        @keyframes typeLine {
            to { opacity: 1; transform: translateX(0); }
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            box-shadow: 0 0 10px var(--primary);
            transition: width 0.1s linear;
        }

        /* Bypass Button */
        .btn-bypass {
            background: transparent;
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #94a3b8;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .btn-bypass::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-bypass:hover {
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            text-shadow: 0 0 5px var(--primary);
        }

        .btn-bypass:hover::before {
            left: 100%;
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.3;
        }

    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="ambient-glow"></div>
    <div class="scanlines"></div>

    <div class="hud-wrapper">
        <div class="hud-inner">
            <div class="corner c-tl"></div>
            <div class="corner c-tr"></div>
            <div class="corner c-bl"></div>
            <div class="corner c-br"></div>

            <div class="hex-container">
                <div class="hex-border"></div>
                <!-- Inline SVG of a hexagon for exact shape matching if needed, but CSS clip-path works -->
                <div style="width: 100%; height: 100%; position: absolute; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); border: 1px solid var(--primary); box-sizing: border-box;"></div>
                <img src="logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/75/030712/38bdf8?text=AI'">
            </div>

            <h1 class="title glitch" data-text="SYSTEM UPLINK">SYSTEM UPLINK</h1>
            
            <div class="subtitle">
                <div class="spinner"></div>
                <span id="auth-status">AUTHENTICATING...</span>
            </div>

            <div class="terminal">
                <div class="terminal-lines" id="term-lines">
                    <!-- Lines added via JS -->
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-header">
                    <span>TRANSFER_RATE: <span id="rate">0</span> MB/s</span>
                    <span>T-MINUS: <span id="countdown">04.00</span>s</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" id="p-bar"></div>
                </div>
            </div>

            <a href="https://tally.so/r/RGbkdj" class="btn-bypass">>> INITIATE_MANUAL_OVERRIDE</a>
        </div>
    </div>

    <script>
        // Particle Background Logic
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.getElementById('particles').appendChild(canvas);
        
        let width, height, particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 1.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if(this.x < 0 || this.x > width) this.vx = -this.vx;
                if(this.y < 0 || this.y > height) this.vy = -this.vy;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.fill();
            }
        }

        for(let i=0; i<70; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            
            for(let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                for(let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if(dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(56, 189, 248, ${0.15 - dist/1000})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Terminal Typing Logic
        const logs = [
            { text: "Resolving DNS for external node...", type: "normal", delay: 400 },
            { text: "Node found at IP 104.21.x.x", type: "success", delay: 1200 },
            { text: "Bypassing local firewalls...", type: "warning", delay: 2000 },
            { text: "Secure handshake complete. Bridging...", type: "success", delay: 2800 }
        ];

        const termLines = document.getElementById('term-lines');
        
        logs.forEach(log => {
            setTimeout(() => {
                const line = document.createElement('div');
                line.className = 'line';
                
                const prefix = document.createElement('span');
                prefix.className = 'prefix';
                prefix.textContent = '>';
                
                const content = document.createElement('span');
                if(log.type === 'success') content.className = 'success';
                if(log.type === 'warning') content.className = 'warning';
                content.textContent = log.text;
                
                line.appendChild(prefix);
                line.appendChild(content);
                termLines.appendChild(line);
                
                if(termLines.children.length > 3) {
                    termLines.removeChild(termLines.firstChild);
                }
            }, log.delay);
        });

        // Countdown & Progress Logic
        const REDIRECT_URL = "https://tally.so/r/RGbkdj";
        const totalTime = 4000; // 4 seconds
        let startTime = Date.now();
        
        const countdownEl = document.getElementById('countdown');
        const pBar = document.getElementById('p-bar');
        const rateEl = document.getElementById('rate');
        const statusEl = document.getElementById('auth-status');

        function updateProgress() {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, totalTime - elapsed);
            
            // Format time
            const seconds = (remaining / 1000).toFixed(2);
            countdownEl.textContent = seconds.padStart(5, '0');
            
            // Progress bar
            const percent = Math.min(100, (elapsed / totalTime) * 100);
            pBar.style.width = `${percent}%`;
            
            // Random transfer rate
            if(Math.random() > 0.8) {
                rateEl.textContent = (Math.random() * 100 + 400).toFixed(1);
            }

            // Update status text
            if(percent > 25 && percent < 50) statusEl.textContent = "DECRYPTING PAYLOAD...";
            if(percent >= 50 && percent < 85) statusEl.textContent = "ESTABLISHING TUNNEL...";
            if(percent >= 85) statusEl.textContent = "REDIRECTING...";

            if (elapsed < totalTime) {
                requestAnimationFrame(updateProgress);
            } else {
                window.location.replace(REDIRECT_URL);
            }
        }
        
        requestAnimationFrame(updateProgress);

    </script>
</body>
</html>
