<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIML Voice | Your Voice Matters</title>
    <link rel="icon" href="logo.png" type="image/png">
    <!-- Fallback Redirect -->
    <meta http-equiv="refresh" content="5; url=https://tally.so/r/RGbkdj">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050508;
            --primary: #00f0ff;
            --primary-dim: rgba(0, 240, 255, 0.4);
            --accent: #0080ff;
            --purple: #8b5cf6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --card-bg: rgba(10, 12, 16, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --focus-glow: rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Mouse Tracker Glow */
        #cursor-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        /* Ambient Background */
        .ambient-mesh {
            position: fixed;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(0, 128, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
            z-index: 1;
            animation: breathe 20s ease-in-out infinite alternate;
            transition: opacity 2s ease;
        }

        .ambient-mesh.brighten {
            opacity: 1.5;
            background: 
                radial-gradient(circle at 30% 40%, rgba(0, 128, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
        }

        @keyframes breathe {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }

        /* Particles */
        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* Container Layout */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Central Glass Card */
        .glass-card {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3.5rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                inset 0 -1px 20px rgba(0, 240, 255, 0.03);
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card.expanded {
            max-width: 900px;
            padding: 4rem 3rem;
        }

        /* Logo Animation */
        .logo-container {
            position: relative;
            width: 85px;
            height: 85px;
            margin-bottom: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 1s ease;
        }
        
        .expanded .logo-container {
            width: 60px;
            height: 60px;
            margin-bottom: 1.5rem;
        }

        .logo-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--primary);
            border-radius: 50%;
            filter: blur(25px);
            opacity: 0.3;
            animation: logoBreathe 4s ease-in-out infinite alternate;
        }

        @keyframes logoBreathe {
            0% { transform: scale(0.9); opacity: 0.2; }
            100% { transform: scale(1.1); opacity: 0.4; }
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            position: relative;
            z-index: 2;
        }

        /* --- LOADING UI --- */
        .loader-ui {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .loader-ui.hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        .loader-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .progress-wrapper {
            width: 100%;
            margin-bottom: 2rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            border-radius: 4px;
            box-shadow: 0 0 12px var(--primary-dim);
            position: relative;
            transition: width 0.1s ease;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 30px;
            background: #fff;
            filter: blur(6px);
            opacity: 0.9;
            animation: streak 2s linear infinite;
        }

        .logs-container {
            width: 100%;
            height: 60px;
            position: relative;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }

        .log-line {
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .log-line.active { opacity: 1; transform: translateY(0); }
        .log-line.exit { opacity: 0; transform: translateY(-10px); }


        /* --- MAIN HERO UI --- */
        .hero-ui {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            position: absolute;
            transform: scale(0.95);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            transition-delay: 0.2s;
            text-align: center;
        }

        .hero-ui.visible {
            opacity: 1;
            visibility: visible;
            position: relative;
            transform: scale(1);
        }

        .brand-text {
            font-size: 0.85rem;
            color: var(--primary);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .main-headline {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .sub-headline {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 650px;
            margin-bottom: 2rem;
        }

        .secondary-text {
            font-size: 0.9rem;
            color: rgba(148, 163, 184, 0.7);
            margin-bottom: 3rem;
            font-style: italic;
        }

        .cta-button {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: var(--primary);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .cta-button:hover {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        .cta-button:hover::before {
            left: 100%;
        }


        /* --- FORM UI --- */
        .form-ui {
            width: 100%;
            display: none; /* Initially hidden */
            flex-direction: column;
            gap: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: left;
        }

        .form-ui.visible {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .form-header {
            margin-bottom: 1rem;
            text-align: center;
        }

        .form-header h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.2rem 1rem 0.6rem 1rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: #fff;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea.input-field {
            min-height: 120px;
            resize: vertical;
        }

        .floating-label {
            position: absolute;
            top: 1.2rem;
            left: 1rem;
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.3s ease;
            transform-origin: left top;
        }

        .input-field:focus, 
        .input-field:not(:placeholder-shown) {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 15px var(--focus-glow);
        }

        .input-field:focus + .floating-label,
        .input-field:not(:placeholder-shown) + .floating-label {
            transform: translateY(-0.8rem) scale(0.75);
            color: var(--primary);
        }

        .select-field {
            padding: 1rem;
            appearance: none;
            cursor: pointer;
        }
        
        .select-field option {
            background: var(--bg-dark);
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            border: none;
            color: #fff;
            padding: 1.2rem;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 10px 20px rgba(0, 240, 255, 0.2);
        }

        .submit-btn:hover {
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .main-headline { font-size: 2.5rem; }
            .glass-card { padding: 2.5rem 1.5rem; }
            .glass-card.expanded { padding: 3rem 1.5rem; }
        }

    </style>
</head>
<body>
    <div class="ambient-mesh" id="mesh"></div>
    <div id="particles"></div>
    <div id="cursor-glow"></div>

    <div class="app-container">
        <div class="glass-card" id="main-card">
            
            <div class="logo-container">
                <div class="logo-glow"></div>
                <img src="logo.png" alt="AIML Club Logo" class="logo" onerror="this.src='https://via.placeholder.com/85/050508/00f0ff?text=AI'">
            </div>
            
            <!-- LOADING SEQUENCE -->
            <div class="loader-ui" id="loader-ui">
                <div class="loader-title">System Handshake</div>
                
                <div class="progress-wrapper">
                    <div class="progress-header">
                        <span>NETWORK_LINK</span>
                        <span id="percent">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="p-bar"></div>
                    </div>
                </div>

                <div class="logs-container" id="logs">
                    <!-- Logs injected via JS -->
                </div>
            </div>

            <!-- HERO SECTION -->
            <div class="hero-ui" id="hero-ui">
                <div class="brand-text">AI & Machine Learning Club – OCT</div>
                <h1 class="main-headline">Your Voice Matters</h1>
                <p class="sub-headline">Every idea can create impact. Share your thoughts, feedback, workshop interests, event concepts, and innovative suggestions with the AIML ecosystem.</p>
                
                <p class="secondary-text" id="redirect-status" style="margin-top: 2rem; color: var(--primary);">Redirecting to Nexus...</p>
            </div>

        </div>
    </div>

    <script>
        // --- Cursor Glow ---
        const cursorGlow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        // --- Neural Particles ---
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.getElementById('particles').appendChild(canvas);
        
        let width, height, particles = [];
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.radius = Math.random() * 1.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if(this.x < 0 || this.x > width) this.vx = -this.vx;
                if(this.y < 0 || this.y > height) this.vy = -this.vy;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, 0.4)`;
                ctx.fill();
            }
        }

        for(let i=0; i<45; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for(let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for(let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.08 - dist/1800})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- Loading Sequence ---
        const messages = [
            "Initializing AIML Voice...",
            "Connecting student innovation network...",
            "Authenticating student node...",
            "Syncing collaborative intelligence...",
            "Establishing secure voice channel...",
            "Innovation portal ready."
        ];

        const logsContainer = document.getElementById('logs');
        const pBar = document.getElementById('p-bar');
        const percentText = document.getElementById('percent');
        const card = document.getElementById('main-card');
        const loaderUi = document.getElementById('loader-ui');
        const heroUi = document.getElementById('hero-ui');
        const mesh = document.getElementById('mesh');
        
        let currentMsg = 0;
        const totalDuration = 3000; // Fast 3s loading
        const startTime = Date.now();

        const logElements = messages.map(msg => {
            const el = document.createElement('div');
            el.className = 'log-line';
            el.textContent = `> ${msg}`;
            logsContainer.appendChild(el);
            return el;
        });

        function updateLoader() {
            const elapsed = Date.now() - startTime;
            let progress = Math.min(100, (elapsed / totalDuration) * 100);
            const easeProgress = 1 - Math.pow(1 - (progress/100), 3);
            const currentPercent = Math.round(easeProgress * 100);
            
            pBar.style.width = `${currentPercent}%`;
            percentText.textContent = `${currentPercent}%`;

            const msgIndex = Math.floor((progress / 100) * messages.length);
            if (msgIndex !== currentMsg && msgIndex < messages.length) {
                if(logElements[currentMsg]) logElements[currentMsg].className = 'log-line exit';
                currentMsg = msgIndex;
                if(logElements[currentMsg]) logElements[currentMsg].className = 'log-line active';
            } else if (currentMsg === 0 && logElements[0].className === 'log-line') {
                logElements[0].className = 'log-line active';
            }

            if (progress < 100) {
                requestAnimationFrame(updateLoader);
            } else {
                completeLoading();
            }
        }

        function completeLoading() {
            if(logElements[currentMsg]) logElements[currentMsg].className = 'log-line exit';
            
            setTimeout(() => {
                // Hide Loader
                loaderUi.classList.add('hidden');
                
                // Expand Card & Brighten Background
                card.classList.add('expanded');
                mesh.classList.add('brighten');
                
                // Show Hero UI
                setTimeout(() => {
                    heroUi.classList.add('visible');
                    
                    // Trigger actual redirect after a brief moment to read the Hero text
                    setTimeout(() => {
                        window.location.replace("https://tally.so/r/RGbkdj");
                    }, 1500);

                }, 500);

            }, 400);
        }

        requestAnimationFrame(updateLoader);

    </script>
</body>
</html>
